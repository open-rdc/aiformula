data:
  bag_path: "data/rosbag"
  raw_dir: "data/raw"
  dataset_dir: "data/dataset"
  image_topic: "/zed/zed_node/rgb/image_rect_color"
  cmd_topic: "/cmd_vel"
  val_ratio: 0.2
  horizontal_flip: true
  steering_max: 15.0
  velocity_max: 5.0

train:
  epochs: 100
  batch_size: 64
  lr: 0.001
  num_workers: 4
  loss: weighted_smooth_l1
  loss_weights: [1.0, 0.5]
  seed: 42
  checkpoint_dir: "checkpoints"
  log_dir: "runs"

model:
  output_dim: 2
