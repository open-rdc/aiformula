launch:
  ros__parameters:
    joy: true
    vectornav : false
    odrive : false
    socketcan : false
    zed : false
    sim : true

/**:
  ros__parameters:
    linear_max:
      vel : 5.0
      acc: 5.0
      jer: 0.0
    steering_max :
      pos : 15.0

    tread : 0.6
    wheelbase : 0.8

zed_wrapper_node:
  ros__parameters:
    grab_fps             : 15
    resolution           : "HD1080"
    depth_mode           : "NEURAL"
    confidence_threshold : 50
    serial_number        : 0

controller_node:
  ros__parameters:
    linear_max_vel : 2.0

vectormap_server_node:
  ros__parameters:
    map_path : "aiformula_course.osm"
    publish_period_ms : 1000
    map_axis_convention : "image_x_right_y_up"
    map_origin_pixel:
      x : 0.0
      y : 0.0
    meter_per_pixel : 0.1739579
    map_origin_geodetic:
      latitude :  36.11313110136178
      longitude: 139.98107529988687
    map_yaw_from_east : 0.02686650

localization_node:
  ros__parameters:
    update_period_ms : 100
    imu_yaw_convention : "heading_north_ccw"
    map_origin_geodetic:
      latitude :  36.11313110136178
      longitude: 139.98107529988687
    map_yaw_from_east : 0.02686650
    mask_threshold : 128
    pixel_step : 4
    max_observed_points : 2000
    min_observed_points : 5
    min_map_points : 5
    map_sample_interval_m : 0.25
    ground_plane_z_base : 0.0
    min_ground_intersection_distance : 0.2
    max_ground_intersection_distance : 30.0
    camera:
      fx : 246.55866667
      fy : 246.389
      cx : 318.345
      cy : 186.59033333
    camera_to_base:
      x : 0.055
      y : 0.0
      z : 0.54
      roll : -1.61442956
      pitch : -0.00349065850
      yaw : -1.57428698530
    icp:
      max_iterations : 20
      max_correspondence_distance : 1.5
      convergence_translation_epsilon : 0.01
      min_correspondences : 5
    ekf:
      initial_position_variance : 1.0
      initial_yaw_variance : 0.3
      initial_velocity_variance : 1.0
      initial_yaw_rate_variance : 0.5
      process_position_variance : 0.1
      process_yaw_variance : 0.05
      process_velocity_variance : 0.5
      process_yaw_rate_variance : 0.2
      gnss_position_variance : 1.0
      imu_yaw_variance : 0.05
      icp_position_variance : 0.15
      position_gate_dist : 3.0
      yaw_gate_dist : 3.0

odom_tf_node:
  ros__parameters:
    publish_period_ms : 20
    imu_yaw_convention : "heading_north_ccw"
    max_integration_dt : 0.2

map_odom_tf_node:
  ros__parameters:
    publish_period_ms    : 50
    stale_warn_timeout_s : 2.0

mission_planner_node:
  ros__parameters:
    update_period_ms : 100
    default_nav_cmd : "straight"
    nav_cmd_fallback_order : ["straight", "left", "right"]
    global_path_resample_interval_m : 0.2
    max_centerline_connection_gap_m : 0.5
    off_route_distance_threshold_m : 3.0
    route_lookahead_lanelet_count : 3
    start_lanelet_yaw_threshold_rad : 1.5708
    start_pose_position_variance_threshold : 0.3

local_planner_server_node:
  ros__parameters:
    local_planner_plugin : "local_planner::FrenetPlannerPlugin"
    update_period_ms : 100
    local_path_horizon_m : 15.0
    local_path_resample_interval_m : 0.2
    max_centerline_connection_gap_m : 0.5
    vehicle_width_m : 0.6
    avoidance_detection_forward_distance_m : 15.0
    avoidance_hard_margin_m : 0.2
    avoidance_soft_margin_m : 0.3
    envelope_buffer_margin_m : 0.2
    avoidance_lateral_jerk_mps3 : 1.0
    avoidance_min_velocity_mps : 0.5
    max_avoidance_shift_m : 1.0
    frenet_collision_check_margin_m : 0.2
    frenet_weight_lateral_offset : 1.0
    frenet_weight_lateral_change : 0.2
    frenet_weight_avoidance_shift : 0.1

object_detector_node:
  ros__parameters:
    ground_z_threshold_m : 0.1
    voxel_leaf_size_m : 0.1
    cluster_tolerance_m : 0.5
    min_cluster_size : 10
    max_cluster_size : 1000
    marker_height_m : 1.0

controller_server_node:
  ros__parameters:
    control_period_ms  : 50
    controller_plugin  : "trajectory_follower::PurePursuitPlugin"

    pure_pursuit:
      lookahead_distance : 5.0
      steered_gain       : 1.8

    mpc:
      longitudinal:
        a_lat_max          : 5.0
        a_max              : 5.0
        a_min              : -2.0
        jerk_max           : 5.0
        kp                 : 0.8
        ki                 : 0.1
        kd                 : 0.0
        lpf_vel_error_gain : 0.9
        stop_distance      : 0.5
      lateral:
        horizon                       : 20
        prediction_dt                 : 0.1
        min_predict_speed             : 0.5
        steer_tau                     : 0.3
        weight_lat_error              : 1.0
        weight_heading_error          : 1.0
        weight_steering_input         : 0.5
        weight_steer_rate             : 5.0
        weight_terminal_lat_error     : 1.0
        weight_terminal_heading_error : 1.0

chassis_driver_node:
  ros__parameters:
    interval_ms : 2
    wheel_radius : 0.124
    reduction_ratio : 1.0
    reverse_left_flag : false
    reverse_right_flag : false
    caster:
      max_count : 16384
      gear_ratio : 0.59090909090909
      wheel_radius : 0.12
      reel_radius : 0.02
      steering_radius : 0.032
      preload_length : 0.03
      preload_gain : 0.1
    drive_pid:
      p_gain : 3.0
      i_gain : 0.0
      d_gain : 0.1

socketcan_interface_node:
  ros__parameters:
    if_name : "can_main"
