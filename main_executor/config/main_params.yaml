launch:
  ros__parameters:
    joy: true
    sim : true
    mapless : false

/**:
  ros__parameters:
    linear_max:
      vel : 3.0
      acc: 5.0
      jer: 0.0
    steering_max :
      pos : 15.0

    tread : 0.6
    wheelbase : 0.8

    camera:
      position:
        x : -0.008
        y : 0.0325
        z : 0.5547
      orientation:
        roll : -89.801314
        pitch : 0.497098
        yaw : -89.640661

controller_node:
  ros__parameters:
    linear_max_vel : 4.0

zed_wrapper_node:
  ros__parameters:
    fps: 15
    camera:
      size : "nHD" # nHD（640×360）, SVGA（960×600）, HD1080（1920×1080）, HD1200（1920×1200）
    depth:
      mode: "NEURAL" # NEURAL, PERFORMANCE, QUALITY
      confidence_threshold : 50

road_detector_node:
  ros__parameters:
    mask_threshold : 0.5

lane_line_publisher_node:
  ros__parameters:
    mask_threshold : 128
    voxel_grid_size_meter : 0.25

vectormap_server_node:
  ros__parameters:
    map_path : "aiformula_course.osm"

pose_estimater_node:
  ros__parameters:
    interval_ms : 20
    max_integration_dt : 0.2
    map_origin_geodetic:
      latitude :  36.11313110136178
      longitude: 139.98107529988687
    map_yaw_from_east : 0.02686650
    min_observed_points : 5
    map_sample_interval_m : 0.25
    gnss_position_variance : 1.0
    imu_yaw_variance : 0.05
    # pf パラメータ
    num_particles : 500
    odom_fw_dev_per_fw : 0.1
    odom_fw_dev_per_rot : 0.001
    odom_rot_dev_per_fw : 0.01
    odom_rot_dev_per_rot : 0.2
    likelihood_dev : 0.12
    likelihood_max_dist : 1.5
    resample_ess_ratio_threshold : 0.5
    reinit_residual_threshold : 0.8
    reinit_consecutive_frames : 30
    min_position_variance : 0.05
    min_yaw_variance : 0.00023

ekf_localizer_node:
  ros__parameters:
    predict_interval_ms : 20
    tf_interval_ms : 100
    initial_position_variance : 1.0
    initial_yaw_variance : 0.3
    process_position_variance : 0.01
    process_yaw_variance : 0.001
    process_velocity_variance : 4.0
    process_yaw_rate_variance : 0.05
    position_gate_dist : 5.0
    yaw_gate_dist : 3.0
    velocity_gate_dist : 5.0
    min_position_variance : 0.015
    min_yaw_variance : 0.00001
    min_velocity_variance : 0.1
    min_yaw_rate_variance : 0.02
    pf_pose_max_delay_s : 0.5
    velocity_max_delay_s : 0.1
    velocity_gate_max_reject_duration_s : 0.3
    position_gate_max_reject_duration_s : 1.0
    yaw_gate_max_reject_duration_s : 1.0

odom_tf_node:
  ros__parameters:
    publish_period_ms : 20
    max_integration_dt : 0.2

map_odom_tf_node:
  ros__parameters:
    publish_period_ms    : 50
    stale_warn_timeout_s : 2.0

mission_planner_node:
  ros__parameters:
    update_period_ms : 100
    default_navigation_command : "straight"
    navigation_command_fallback_order : ["straight", "left", "right"]
    global_path_resample_interval_m : 0.2
    max_centerline_connection_gap_m : 0.5
    off_route_distance_threshold_m : 3.0
    route_lookahead_lanelet_count : 3
    start_lanelet_yaw_threshold_rad : 0.7854
    start_lanelet_max_distance_m : 5.0
    start_pose_position_variance_threshold : 0.3
    route_extension_min_remaining_m : 20.0

local_planner_server_node:
  ros__parameters:
    local_planner_plugin : "local_planner::FrenetPlannerPlugin"
    interval_ms : 100
    # plugin パラメータ
    local_path_horizon_m : 15.0
    local_path_resample_interval_m : 0.2
    avoidance_detection_forward_distance_m : 20.0
    avoidance_hard_margin_m : 0.4
    avoidance_soft_margin_m : 0.3
    max_avoidance_shift_m : 3.0
    frenet:
      lateral_sample_step_m : 0.25
      collision_check_margin_m : 0.2
      target_lengths_m : [7.5, 15.0]
      weight_curvature : 2000.0
      weight_length : 1.0
      weight_lateral_deviation : 50.0
    stop_standoff_m : 1.0

pylon_detector_node:
  ros__parameters:
    engine_path : "yolox_s_aiformula.engine"
    score_threshold : 0.3
    nms_threshold : 0.45

vision_lane_planner_node:
  ros__parameters:
    engine_path : "vision_planner_n.engine"
    exist_threshold : 0.5
    valid_threshold : 0.5
    default_navigation_command : "straight"
    path_resample_interval_m : 0.2
    min_path_points : 2

controller_server_node:
  ros__parameters:
    interval_ms  : 50
    controller_plugin  : "trajectory_follower::PurePursuitPlugin"
    a_lat_max          : 5.0
    a_min              : -2.0
    pure_pursuit:
      lookahead_distance : 5.0
      steered_gain       : 1.8
    mpc:
      longitudinal:
        a_max              : 5.0
        jerk_max           : 5.0
        kp                 : 0.8
        ki                 : 0.1
        kd                 : 0.0
        lpf_vel_error_gain : 0.9
      lateral:
        horizon                       : 20
        prediction_dt                 : 0.1
        min_predict_speed             : 0.5
        steer_tau                     : 0.3
        weight_lat_error              : 1.0
        weight_heading_error          : 1.0
        weight_steering_input         : 0.5
        weight_steer_rate             : 5.0
        weight_terminal_lat_error     : 1.0
        weight_terminal_heading_error : 1.0
