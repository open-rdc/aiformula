launch:
  ros__parameters:
    joy: false
    sim : true
    mapless : true

/**:
  ros__parameters:
    linear_max:
      vel : 3.0
      acc: 3.0
      jer: 15.0
    steering_max :
      pos : 15.0

    tread : 0.6
    wheelbase : 0.733

    camera:
      position:
        x : -0.008
        y : 0.0325
        z : 0.5547
      orientation:
        roll : -89.801314
        pitch : 0.497098
        yaw : -89.640661

controller_node:
  ros__parameters:
    linear_max_vel : 4.0

zed_wrapper_node:
  ros__parameters:
    fps: 15
    camera:
      size : "nHD" # nHD（640×360）, SVGA（960×600）, HD1080（1920×1080）, HD1200（1920×1200）
    depth:
      mode: "NEURAL" # NEURAL, PERFORMANCE, QUALITY
      confidence_threshold : 50

road_detector_node:
  ros__parameters:
    mask_threshold : 0.5

lane_line_publisher_node:
  ros__parameters:
    mask_threshold : 128
    voxel_grid_size_meter : 0.25

vectormap_server_node:
  ros__parameters:
    map_path : "aiformula_course.osm"

topomap_server_node:
  ros__parameters:
    map_path : "aiformula_topomap.osm"

topomap_localizer_node:
  ros__parameters:
    interval_ms : 50
    route : [10000000000, 10000000001, 10000000002, 10000000006, 10000000003, 10000000004]
    initial_pose : [1.5, 3.0, -89.0] # 初期位置設定（GNSSを使わない場合に利用）
    init_gnss_flag : false # 初期位置だけはGNSSから取得（移動は推測航法）
    trigger_distance_m : 20.0
    turn_angle_deg : 60.0
    heading_tolerance_deg : 45.0
    straight_angle_deg : 30.0
    anchor_window : 4

pose_estimater_node:
  ros__parameters:
    interval_ms : 20
    max_integration_dt : 0.2
    map_origin_geodetic:
      latitude :  36.11313110136178
      longitude: 139.98107529988687
    map_yaw_from_east : 0.02686650
    min_observed_points : 5
    map_sample_interval_m : 0.25
    gnss_position_variance : 1.0
    imu_yaw_variance : 0.05
    # pf パラメータ
    num_particles : 500
    odom_fw_dev_per_fw : 0.1
    odom_fw_dev_per_rot : 0.001
    odom_rot_dev_per_fw : 0.01
    odom_rot_dev_per_rot : 0.2
    likelihood_dev : 0.12
    likelihood_max_dist : 1.5
    resample_ess_ratio_threshold : 0.5
    reinit_residual_threshold : 0.8
    reinit_consecutive_frames : 30
    min_position_variance : 0.05
    min_yaw_variance : 0.00023

ekf_localizer_node:
  ros__parameters:
    predict_interval_ms : 20
    tf_interval_ms : 100
    initial_position_variance : 1.0
    initial_yaw_variance : 0.3
    process_position_variance : 0.01
    process_yaw_variance : 0.001
    process_velocity_variance : 4.0
    process_yaw_rate_variance : 0.05
    position_gate_dist : 5.0
    yaw_gate_dist : 3.0
    velocity_gate_dist : 5.0
    min_position_variance : 0.015
    min_yaw_variance : 0.00001
    min_velocity_variance : 0.1
    min_yaw_rate_variance : 0.02
    pf_pose_max_delay_s : 0.5
    velocity_max_delay_s : 0.1
    velocity_gate_max_reject_duration_s : 0.3
    position_gate_max_reject_duration_s : 1.0
    yaw_gate_max_reject_duration_s : 1.0

odom_tf_node:
  ros__parameters:
    publish_period_ms : 20
    max_integration_dt : 0.2

map_odom_tf_node:
  ros__parameters:
    publish_period_ms    : 50
    stale_warn_timeout_s : 2.0

mission_planner_node:
  ros__parameters:
    update_period_ms : 100
    default_navigation_command : "straight"
    navigation_command_fallback_order : ["straight", "left", "right"]
    global_path_resample_interval_m : 0.2
    max_centerline_connection_gap_m : 0.5
    off_route_distance_threshold_m : 3.0
    route_lookahead_lanelet_count : 3
    start_lanelet_yaw_threshold_rad : 0.7854
    start_lanelet_max_distance_m : 5.0
    start_pose_position_variance_threshold : 0.3
    route_extension_min_remaining_m : 20.0

local_planner_server_node:
  ros__parameters:
    local_planner_plugin : "local_planner::FrenetPlannerPlugin"
    interval_ms : 100
    # plugin パラメータ
    local_path_horizon_m : 20.0
    local_path_resample_interval_m : 0.2
    avoidance_detection_forward_distance_m : 20.0
    avoidance_hard_margin_m : 0.35
    avoidance_soft_margin_m : 1.0
    max_avoidance_shift_m : 2.4
    lane_width_m : 4.0   # 車線幅
    lane_boundary_margin_m : 0.1   # 回避時に車輪を車線の端から内側に残す余裕
    obstacle_cluster_gap_m : 0.8
    frenet:
      lateral_sample_step_m : 0.15
      collision_check_margin_m : 0.15
      avoidance_target_lengths_m : [15.0]   # 障害物があるときの回避経路の距離
      merge_time_s : 1.0   # 障害物がないときの合流距離 = merge_time_s × 車速
      merge_lateral_accel_mps2 : 1.0   # 合流時の横加速度上限
      merge_length_min_m : 4.0
      merge_length_max_m : 15.0
      weight_curvature : 2000.0
      weight_lateral_deviation : 150.0
      weight_side_change : 300.0
      kappa_max : 0.268   # 候補経路の曲率の上限 [1/m]
      side_release_count : 3   # 回避する側を何周期続けて通れなければ反対側を許すか
    stop_standoff_m : 1.0

speed_path_planner_node:
  ros__parameters:
    a_lat_max          : 3.0   # 最大横加速度 [m/s^2]
    stop_decel         : 1.5   # 停止点へ向けた減速度 [m/s^2]
    stop_decel_max     : 4.0   # stop_decel で止まれないときに使う減速度の上限 [m/s^2]
    stop_point_timeout_s : 0.5
    branch_linear_max:
      vel : 4.0   # 分岐路付近での速度上限 [m/s]

pylon_detector_node:
  ros__parameters:
    engine_path : "yolox_s_aiformula.engine"
    score_threshold : 0.3
    nms_threshold : 0.45

traffic_signal_stop_node:
  ros__parameters:
    stop_distance_to_panel_pylon_m : 3.3

vision_lane_planner_node:
  ros__parameters:
    engine_path : "vision_planner_n.engine"
    default_navigation_command : "straight"

path_smoother_node:
  ros__parameters:
    window_duration_s : 0.15
    tf_timeout_s : 0.1
    fit_max_x_m : 12.0
    extend_to_x_m : 18.0
    output_interval_m : 0.2
    ransac_threshold_m : 0.10
    ransac_iterations : 200

controller_server_node:
  ros__parameters:
    interval_ms  : 50
    controller_plugin  : "trajectory_follower::PurePursuitPlugin"
    a_min              : -4.0
    velocity_preview_time : 0.3
    pure_pursuit:
      lookahead_gain         : 1.2
      lookahead_min_distance : 3.0
      lookahead_max_distance : 5.0
      steered_gain       : 1.8
    mpc:
      longitudinal:
        max_integral_effort : 0.5
        kp                 : 1.5
        ki                 : 0.3
        kd                 : 0.0
        lpf_vel_error_gain : 0.5
      lateral:
        horizon                       : 20
        prediction_dt                 : 0.1
        min_predict_speed             : 0.5
        steer_tau                     : 0.22
        weight_lat_error              : 1.0
        weight_heading_error          : 1.0
        weight_steering_input         : 0.1
        weight_steer_rate             : 30.0
        weight_terminal_lat_error     : 1.0
        weight_terminal_heading_error : 1.0
